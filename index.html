<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<script>
  /* Written in old, plain JavaScript on purpose: it reports problems even if newer code can't run. */
  window.__crateErrors = [];
  window.addEventListener("error", function (e) {
    window.__crateErrors.push((e.message || "error") + (e.filename ? " (" + e.filename.split("/").pop().split("?")[0] + ":" + e.lineno + ")" : ""));
  }, true);
  setTimeout(function () {
    if (window.__crateBooted) return;
    var d = document.createElement("div");
    d.className = "toast"; d.setAttribute("role", "alert");
    d.style.cssText = "top:16px;bottom:auto;max-width:calc(100vw - 32px);white-space:normal;user-select:text";
    d.textContent = "Crate didn't start. " + (window.__crateErrors.join(" | ") || "No error was reported.") + " · " + navigator.userAgent;
    document.body.appendChild(d);
  }, 8000);
</script>
<script>try { document.documentElement.dataset.theme = localStorage.getItem("crate:theme") || "dark"; } catch (e) {}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crate</title>
<meta name="description" content="My albums in crates, by period of my life.">
<meta name="theme-color" content="#101216">
<!-- No apple-mobile-web-app-capable: the home-screen icon opens in Safari, where tapping
     a music.youtube.com link hands off to the YouTube Music app. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Permanent+Marker&display=swap">
<link rel="stylesheet" href="style.css?v=20261030030143">
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Library">
    <a class="brand" href="#home" title="Home">Crate</a>
    <div class="rail-label">Crates</div>
    <nav id="shelf-nav" aria-label="Crates"></nav>
    <form id="new-shelf" class="new-shelf">
      <input id="new-shelf-name" placeholder="New crate…" aria-label="New crate name" autocomplete="off">
      <button class="btn" aria-label="Create crate">+</button>
    </form>
    <nav class="rail-pages" aria-label="Pages">
      <a class="rail-link" href="#crates" data-route="crates">All crates</a>
      <a class="rail-link" href="#new" data-route="new">New releases</a>
      <a class="rail-link" href="#chores" data-route="chores"><span>Sorting chores</span><span class="count" id="chores-count"></span></a>
      <a class="rail-link" href="#recent" data-route="recent">Recently added</a>
      <a class="rail-link" href="#history" data-route="history">Listening history</a>
      <a class="rail-link" href="#vault" data-route="vault">Old hard drive</a>
      <a class="rail-link" href="#links" data-route="links">Album links</a>
    </nav>
  </aside>
  <main>
    <header class="top">
      <div id="top-search"></div>
      <div id="account"></div>
    </header>
    <div id="view"><div class="empty offline">Loading your crates…</div></div>
  </main>
</div>
<div id="menu" class="menu" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
